<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow, noarchive">
<meta name="theme-color" content="#131315">
<title>Sign in · Killua Home Services</title>
<link rel="icon" href="/favicon.svg" type="image/svg+xml">
<style>/*CSS*/</style>
</head>
<body>
<div class="login-wrap">
  <form class="login" method="post" action="/api/dash/login" autocomplete="on">
    <img src="/brand/killua-mark.svg" alt="">
    <h1>Killua Home Services<br>Dashboard</h1>
    <!--MSG-->
    <label class="f">Email<input type="email" name="email" autocomplete="username" required autofocus></label>
    <label class="f">Password<input type="password" name="password" autocomplete="current-password" required></label>
    <button class="btn red" type="submit">Sign in</button>
    <p class="note">Private to the Killua team. Trouble signing in? Ask Blaine.</p>
  </form>
</div>
</body>
</html>
